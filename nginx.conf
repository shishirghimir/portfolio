worker_processes 2;
worker_rlimit_nofile 4096;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile    on;
    tcp_nopush  on;
    server_tokens off;

    keepalive_timeout     15s;
    keepalive_requests    100;
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    reset_timedout_connection on;

    client_max_body_size        16k;
    client_body_buffer_size     16k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;

    limit_conn_zone $binary_remote_addr zone=perip:5m;
    limit_conn_status 429;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        charset utf-8;
        absolute_redirect off;
        limit_conn perip 100;

        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        error_page 404 /404.html;

        location = /index.html {
            if ($request_uri ~ ^/index\.html) { return 301 /; }
        }
        location = /about.html      { return 301 /about/; }
        location = /projects.html   { return 301 /work/; }
        location = /writeups.html   { return 301 /writeups/; }
        location = /certs.html      { return 301 /certifications/; }
        location = /now.html        { return 301 /now/; }
        location = /contact.html    { return 301 /contact/; }

        location = /sw.js {
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            add_header Service-Worker-Allowed "/" always;
        }

        location = /manifest.webmanifest {
            types { application/manifest+json webmanifest; }
            add_header Cache-Control "public, max-age=3600" always;
        }

        location ^~ /_next/static/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location ~* ^/(photos|work|logos|team|tech|og|brand)/ {
            add_header Cache-Control "public, max-age=2592000" always;
        }

        location / {
            try_files $uri $uri/ $uri/index.html =404;
        }
    }
}
