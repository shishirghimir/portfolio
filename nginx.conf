# nginx config for the Docker image — mirrors the headers in vercel.json
# so the container behaves the same as the live Vercel deployment.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    charset_types text/html text/css text/plain text/xml application/javascript application/xml application/manifest+json;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    # Same as Vercel: serve the custom 404 page for missing routes
    error_page 404 /404.html;

    # Service worker must never be cached and needs to scope the whole site
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # PWA manifest with the correct MIME type
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Static assets: 1-year immutable cache
    location ^~ /img/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ^~ /css/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ^~ /js/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # HTML: always revalidate + security headers
    location ~ \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /sitemap.xml {
        types { application/xml xml; }
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /robots.txt {
        types { text/plain txt; }
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
