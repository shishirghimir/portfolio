# nginx config for the Docker image. Mirrors vercel.json (redirects, headers,
# caching) so the container behaves the same as the live site.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    error_page 404 /404.html;

    # old URLs from the previous version of the site
    location = /index.html      { return 301 /; }
    location = /about.html      { return 301 /about/; }
    location = /projects.html   { return 301 /work/; }
    location = /writeups.html   { return 301 /writeups/; }
    location = /certs.html      { return 301 /certifications/; }
    location = /now.html        { return 301 /now/; }
    location = /contact.html    { return 301 /contact/; }

    # the clean-up service worker must never be cached
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "public, max-age=3600" always;
    }

    # hashed build output never changes
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* ^/(photos|work|logos|team|tech|og|brand)/ {
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # pages are folders with index.html (trailing slash URLs)
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
