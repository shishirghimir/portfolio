services:
  portfolio:
    build:
      context: .
      pull: true
    image: shishirghimir/portfolio:latest
    container_name: portfolio
    restart: unless-stopped

    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    mem_limit: 128m
    memswap_limit: 128m
    mem_reservation: 64m
    cpus: 0.5
    cpu_shares: 512
    pids_limit: 64
    oom_score_adj: -500
    ulimits:
      nofile:
        soft: 4096
        hard: 4096

    ports:
      - "8080:8080"
    networks:
      - web

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
